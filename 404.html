<!doctype html>
<!--
  Copy to the root of the BPMData.github.io repository as 404.html.

  GitHub Pages serves this page for any path that has no file, so
  https://bpmdata.github.io/<room-code> forwards to the OverHeard student room at
  https://over-heard-606573080592.us-east1.run.app/<room-code>. Rooms need no pages of their own.

  Real pages (/overheard/, /allaboard/, /privacy.html, project sites such as /OverBoard/)
  always win over this page. OverHeard refuses those names as room codes; when a new page or
  project site is added here, add its name to RESERVED_ROOM_CODES in OverHeard's
  src/rooms/protocol.ts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPMData</title>
<link rel="stylesheet" href="/style.css">
<script>
  (function () {
    var OVERHEARD = 'https://over-heard-606573080592.us-east1.run.app/';
    // Same rule as OverHeard's validRoomCode: 3–40 letters, numbers or hyphens
    var match = /^\/([A-Za-z0-9][A-Za-z0-9-]{2,39})\/?$/.exec(window.location.pathname);
    if (match) {
      window.location.replace(OVERHEARD + match[1].toLowerCase() + window.location.search + window.location.hash);
    }
  })();
</script>
</head>
<body>
<main>
  <div class="doc">
    <h1>Page not found</h1>
    <p>Joining a class? Check the room code your teacher posted, or open
      <a href="https://over-heard-606573080592.us-east1.run.app/">OverHeard</a> and enter it there.</p>
    <p><a href="/">← All apps</a></p>
  </div>
</main>
</body>
</html>
